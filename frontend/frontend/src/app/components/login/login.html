<div class="auth-container">

  <div class="auth-card">

    <h2>Login</h2>

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="user.email">

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="user.password">

    <button (click)="login()">
      Login
    </button>

  </div>

</div>
